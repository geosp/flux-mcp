<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flux-mcp upload</title>
<style>
  :root { color-scheme: light dark; --accent: #2f6fde; --muted: #8a8f98; --border: #8a8f9855; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; margin-bottom: 0.25rem; }
  p.hint { color: var(--muted); margin-top: 0; }
  label { display: block; font-weight: 600; margin: 1rem 0 0.3rem; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit;
    border: 1px solid var(--border); border-radius: 6px; background: transparent; color: inherit; }
  #drop { border: 2px dashed var(--border); border-radius: 10px; padding: 2rem 1rem;
    text-align: center; cursor: pointer; margin-top: 1rem; }
  #drop.over { border-color: var(--accent); }
  #status { margin-top: 1rem; min-height: 1.5em; }
  .error { color: #d33; }
  .result { display: flex; gap: 1rem; align-items: center; border: 1px solid var(--border);
    border-radius: 10px; padding: 0.75rem; margin-top: 0.75rem; }
  .result img { width: 96px; height: 96px; object-fit: cover; border-radius: 6px; }
  .result code { font-size: 0.85rem; word-break: break-all; }
  button { font: inherit; padding: 0.3rem 0.8rem; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: inherit; cursor: pointer; margin-top: 0.4rem; }
</style>
</head>
<body>
<h1>Upload a reference image</h1>
<p class="hint">The returned id works in <code>edit_image</code>, <code>upscale_image</code> and
<code>remove_background</code>.</p>

<label for="token">Bearer token (FLUX_MCP_TOKEN)</label>
<input id="token" type="password" autocomplete="off" placeholder="Kept for this browser tab only">

<div id="drop">Drop images here, or click to choose
  <input id="file" type="file" accept="image/*" multiple hidden>
</div>
<div id="status"></div>
<div id="results"></div>

<script>
const token = document.getElementById("token");
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const statusEl = document.getElementById("status");
const results = document.getElementById("results");

try { token.value = sessionStorage.getItem("flux-token") || ""; } catch (e) {}
token.addEventListener("input", () => {
  try { sessionStorage.setItem("flux-token", token.value); } catch (e) {}
});

drop.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => upload(fileInput.files));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files);
});

async function upload(files) {
  for (const file of files) {
    statusEl.className = ""; statusEl.textContent = `Uploading ${file.name}…`;
    const body = new FormData(); body.append("file", file);
    try {
      const response = await fetch("upload", { method: "POST", body,
        headers: { "Authorization": `Bearer ${token.value.trim()}` } });
      const data = await response.json().catch(() => ({ error: response.statusText }));
      if (!response.ok) throw new Error(data.error || response.statusText);
      statusEl.textContent = "";
      show(file.name, data);
    } catch (err) {
      statusEl.className = "error"; statusEl.textContent = `${file.name}: ${err.message}`;
    }
  }
}

function show(name, data) {
  const row = document.createElement("div"); row.className = "result";
  const img = document.createElement("img"); img.src = data.url; img.alt = name;
  const info = document.createElement("div");
  const id = document.createElement("code"); id.textContent = data.id;
  const meta = document.createElement("div"); meta.className = "hint";
  meta.textContent = `${name} · ${data.width}×${data.height}`;
  const copy = document.createElement("button"); copy.textContent = "Copy id";
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(data.id); copy.textContent = "Copied"; }
    catch (e) { copy.textContent = "Select and copy the id"; }
  };
  info.append(id, meta, copy); row.append(img, info); results.prepend(row);
}
</script>
</body>
</html>
